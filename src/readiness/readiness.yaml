- id: R0001
  name: AI Interaction Logging & Retention
  type: strengthen
  description: Tamper-evidence, clock-sync, time source & uncertainty, correlation IDs, actor identity,
    schema/version, retention, minimization, provider export format.
- id: R0002
  name: Model Checkpoint & Version Archiving
  type: strengthen
  description: Retained, hash-recorded copies of released model artifacts and relevant checkpoints,
    including adapters and fine-tune deltas, with version identifiers, associated training runs,
    timestamps and retention periods, so deployed models can be verified and compared against
    known-good references.
- id: R0003
  name: Inference Configuration Versioning
  type: strengthen
  description: Version-controlled records of system prompts, decoding parameters, guardrail and
    safety-filter settings, model and version identifiers, routing rules and runtime overrides, with
    timestamped and attributable changes, so the effective configuration at the time of an incident
    can be reconstructed.
- id: R0004
  name: Retrieval Index Snapshotting
  type: new
  description: Addresses G0003 partial.
- id: R0005
  name: Model Signing, Attestation & Provenance Registration
  type: strengthen
  description: Signed model/package manifest, trusted identity, key governance, transparency/registry
    record, deployment attestation; watermark/fingerprint registration is an optional child measure, not
    the default control.
- id: R0006
  name: Agent Action & Tool-Call Telemetry
  type: strengthen
  description: Structured records of agent execution steps, including tool or function calls,
    arguments, available results, agent identities, correlation and parent IDs, timestamps from
    synchronized time sources, execution order, errors and retries, retained alongside interaction
    logs (R0001) to support reconstruction of agent activity.
- id: R0007
  name: Training Data Provenance Records
  type: strengthen
  description: Records of dataset sources, licences, collection dates, versions and content hashes,
    preprocessing and filtering steps, train, validation and test splits including held-out sets,
    and links between training or fine-tuning runs and their exact dataset versions, so training
    inputs can be traced and verified.
- id: R0008
  name: Behavioral Baseline Capture
  type: new
  description: Recorded reference prompts and model responses captured at release and after model or
    configuration changes, together with model versions, effective configurations, evaluation
    conditions and repeated outputs where appropriate, so post-incident behavior can be compared
    against a documented baseline.
- id: R0009
  name: AI System, Component & Custodian Register
  type: strengthen
  description: Component identity, owner/custodian, provider, model/package ID, deployment location, data
    stores, tools/endpoints, logging locations, retention, export route, escalation contact. Strengthens
    T0102/T0103/T0104.
- id: R0010
  name: Supplier Forensic Preservation, Export & Change-Notice Clauses
  type: strengthen
  description: Preservation capability, export format, timestamps/time source, integrity metadata, retention,
    model/config change notices, support for legal requests, evidence-delivery responsibility. Addresses
    G0005 partial.
- id: R0011
  name: Reproducible AI Deployment Manifest / AI BOM
  type: strengthen
  description: Model+adapter digests/signatures, tokenizer, container/image, code revision, dependencies,
    runtime/hardware where material, prompt/config version, retrieval snapshot, embedding model, tool
    schemas, attestation chain. A checkpoint alone is not the deployed system.
